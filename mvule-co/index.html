<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mvule &amp; Co. · Handcrafted furniture, Nairobi</title>
    <meta
      name="description"
      content="Solid mvule and mahogany furniture, built by hand in Nairobi and delivered countrywide. A Genmars Tech demonstration site."
    />
    <meta name="theme-color" content="#F5EFE6" />
    <!--
      The fonts are NOT linked here. The active pairing is one of three in
      src/theme.ts, and a hard-coded link here would silently keep loading the
      old pair after somebody switched it. src/main.tsx builds the Google
      Fonts URL from the same constant the CSS variables come from.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
